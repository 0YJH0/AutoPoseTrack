name: autoposetrack

services:
  core:
    build:
      context: .
      dockerfile: Dockerfile
      target: base
      args:
        AUTPOSETRACK_VERSION: ${AUTPOSETRACK_VERSION:-dev}
    image: autoposetrack-core:${AUTPOSETRACK_VERSION:-dev}
    working_dir: /workspace/AutoPoseTrack
    volumes:
      - ./outputs:/workspace/AutoPoseTrack/outputs
      - ${YCBV_ROOT:-./data/ycbv}:/data/ycbv:ro
    environment:
      YCBV_ROOT: /data/ycbv

  dev:
    extends: core
    profiles: [dev]
    command: bash
    stdin_open: true
    tty: true
    volumes:
      - .:/workspace/AutoPoseTrack
      - ${YCBV_ROOT:-./data/ycbv}:/data/ycbv:ro

  training:
    build:
      context: .
      dockerfile: Dockerfile
      target: training
      args:
        AUTPOSETRACK_VERSION: ${AUTPOSETRACK_VERSION:-dev}
    image: autoposetrack-training:${AUTPOSETRACK_VERSION:-dev}
    working_dir: /workspace/AutoPoseTrack
    volumes:
      - ./outputs:/workspace/AutoPoseTrack/outputs
      - ${FEATURE_DATA_ROOT:-./data/features}:/data/features:ro
    environment:
      FEATURE_DATA_ROOT: /data/features

  megapose:
    profiles: [gpu]
    build:
      context: .
      dockerfile: docker/megapose.Dockerfile
      args:
        MEGAPOSE_BASE: ${MEGAPOSE_BASE:-ylabbe/megapose6d:1.0}
    image: autoposetrack-megapose:${AUTPOSETRACK_VERSION:-dev}
    working_dir: /workspace/AutoPoseTrack
    ipc: host
    volumes:
      - ./outputs:/workspace/AutoPoseTrack/outputs
      - ${YCBV_ROOT:-./data/ycbv}:/data/ycbv:ro
      - ${MEGAPOSE_DATA_ROOT:-./data/megapose}:/megapose-data
    environment:
      YCBV_ROOT: /data/ycbv
      MEGAPOSE_DATA_DIR: /megapose-data
      AUTPOSETRACK_MODALITY: rgb
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    command: bash
    stdin_open: true
    tty: true
