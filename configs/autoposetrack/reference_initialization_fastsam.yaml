reference:
  num_refs: 1
  encoder: dinov2_vits14
  device: cuda:0
  use_mask: true
  crop_size: 224
  bbox_expansion: 1.2
  background: mean
  batch_size: 32
  use_fp16: true

proposal:
  backend: fastsam
  checkpoint: data/models/fastsam/FastSAM-s.pt
  device: cuda:0
  inference_size: 640
  confidence: 0.25
  nms_iou: 0.9
  use_fp16: true
  min_area: 100
  max_area_ratio: 0.8
  duplicate_iou: 0.9
  max_proposals: 50

matching:
  aggregation: max
  top_k_average: 2
  acceptance_score: 0.45
  acceptance_margin: 0.02

evaluation:
  mask_iou_threshold: 0.5
  top_k: [1, 3, 5]
