optical_flow:
  backend: farneback
  pyr_scale: 0.5
  levels: 3
  winsize: 15
  iterations: 3
  poly_n: 5
  poly_sigma: 1.2

background:
  model: homography
  sample_step: 8
  ransac_threshold: 3.0
  min_matches: 24
  min_inlier_ratio: 0.3
  min_coverage_ratio: 0.15
  max_median_reprojection_error: 3.0
  fallback: affine

saliency:
  threshold_type: mad
  mad_factor: 3.0
  percentile: 95.0
  fixed_threshold: 2.0
  minimum_threshold: 0.5

morphology:
  enabled: true
  median_kernel: 3
  open_kernel: 3
  close_kernel: 5
  fill_holes: true

proposal:
  min_area_pixels: 8
  min_area_ratio: 0.0
  preserve_small_strong: true
  small_strong_factor: 1.5
  bbox_expand_scale: 1.3
  merge_iou: 0.1
  merge_centroid_distance_ratio: 0.05
  merge_direction_cosine: 0.7
  top_k: 10
  weight_motion: 0.4
  weight_direction: 0.25
  weight_temporal: 0.25
  weight_compactness: 0.1

temporal:
  enabled: true
  history_length: 5
  association_iou: 0.1
  association_distance_ratio: 0.08
  max_missed: 2
