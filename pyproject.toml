[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autoposetrack"
version = "0.1.0"
description = "Research infrastructure for autonomous, failure-aware 6D object pose tracking"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "AutoPoseTrack contributors"}]
dependencies = [
  "numpy>=1.23,<3",
  "Pillow>=9.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.6"]
train = ["scikit-learn>=1.3"]
viz = ["matplotlib>=3.7", "pandas>=2.0"]
motion = ["opencv-python-headless>=4.8,<5"]

[tool.setuptools.packages.find]
include = ["autoposetrack*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
# Keep Python 3.9-compatible Optional/typing imports and module-style scripts.
ignore = ["EXE001", "TRY004", "UP035", "UP045"]
